<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz | MartialTech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/quiz.css">
</head>
<body>
<header class="site-header">
  <div class="container">
    <a class="brand" href="../index.html"><span data-icon="award"></span>Artes Marciais &amp; Educação</a>
    <button class="menu-btn" aria-label="Abrir menu" aria-expanded="false"></button>
    <nav class="nav" aria-label="Principal">
      <a href="../index.html#beneficios">Benefícios</a>
      <!--<a href="../index.html#como-funciona">Como Funciona</a> -->
      <a href="aulas.html">Aulas</a>
      <a href="quiz.html" aria-current="page">Quiz</a>
      <a href="desempenho.html">Desempenho</a>
      <a href="admin.html" data-admin hidden>Admin</a>
      <a class="btn" href="login.html" data-auth>Entrar</a>
      <a href="#" class="sair" data-logout hidden>Sair</a>
    </nav>
  </div>
</header>

<main>
  <section class="page-hero">
    <div class="container">
      <h1>Quiz das Artes Marciais</h1>
      <p>Escolha uma modalidade, responda às perguntas e ganhe 10 XP por acerto.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="xp" aria-label="Seu nível">
        <span class="badge" data-icon="zap"></span>
        <div class="xp-info">
          <div class="xp-top"><b id="nivel">Faixa branca</b><span id="xp-txt">0 XP </span></div>
          <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="xp-bar"><i id="xp-fill"></i></div>
        </div>
      </div>

      <!-- Escolha da modalidade -->
      <div id="menu" class="arts"></div>

      <!-- Pergunta atual -->
      <div id="play" class="play" hidden>
        <div class="play-top">
          <button class="back" id="voltar" type="button"><span data-icon="chevron"></span>Trocar modalidade</button>
          <span class="count" id="contagem"></span>
        </div>
        <div class="bar thin" id="prog" role="progressbar" aria-valuemin="0" aria-valuemax="100"><i></i></div>
        <h2 id="pergunta"></h2>
        <div class="opts" id="opcoes" role="group" aria-labelledby="pergunta"></div>
        <div class="feedback" id="feedback" role="status" aria-live="polite" hidden></div>
        <button class="btn" id="proxima" type="button" hidden>Próxima pergunta</button>
      </div>

      <!-- Resultado -->
      <div id="fim" class="fim" hidden>
        <span class="trophy" data-icon="trophy"></span>
        <h2 id="fim-titulo"></h2>
        <p id="fim-txt"></p>
        <div class="fim-cta">
          <button class="btn" id="repetir" type="button">Refazer quiz</button>
          <button class="btn outline" id="outra" type="button">Outra modalidade</button>
          <a class="btn outline" href="aulas.html">Ver minhas aulas</a>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <a class="brand" href="../index.html"><span data-icon="award"></span>Artes Marciais &amp; Educação</a>
    <p>© 2026 Todos os direitos reservados</p>
  </div>
</footer>
<script src="../scripts/comum.js"></script>
<script src="../scripts/quiz.js"></script>
</body>
</html>
