<main class="auth">
  <div class="container">
    <div class="auth-card">
      <h1>Entrar</h1>
      <p class="sub">Acesse suas aulas e acompanhe seu progresso.</p>
      <form id="form-login" novalidate>
        <label for="email">Email
          <input id="email" type="email" autocomplete="email" placeholder="voce@exemplo.com" required>
        </label>
        <label for="senha">Senha
          <input id="senha" type="password" autocomplete="current-password" required>
        </label>
        <p class="msg" id="msg" role="alert"></p>
        <button class="btn block" type="submit">Entrar</button>
      </form>
      <p class="alt">Ainda não tem conta? <a href="cadastro.html">Criar conta</a></p>
    </div>
  </div>
